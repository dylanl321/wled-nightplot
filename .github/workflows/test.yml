# Lint, typecheck, unit tests plus the headless WLED sim e2e lane (CONFIG-91).
# Runs on every pull request and on push to main.
# The sim is spawned as an external process. That is not Hardware Done.

name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright browser
        run: pnpm --filter @nightplot/web exec playwright install --with-deps chromium

      - name: Phone overflow
        run: pnpm --filter @nightplot/web test:mobile

      - name: Editor use cases at 1440×900 and 390×844
        run: pnpm --filter @nightplot/web test:editor
