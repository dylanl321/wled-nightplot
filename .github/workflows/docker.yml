# Build the Nightplot Configure image. Does not run on pull requests.
#
# How to run it
# - Actions → Docker → Run workflow (`workflow_dispatch`).
# - Push to `main` or a `v*` tag also builds.
# - Push to GHCR only on `main` / tags, and only after GHCR login succeeds
#   (`GITHUB_TOKEN` + `packages: write`). A failed or skipped login still
#   builds; it does not push.
#
# Image: ghcr.io/<owner>/<repo> (this GitHub repo). Not production certified.

name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Log in to GHCR
        id: login
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.login.outcome == 'success' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
