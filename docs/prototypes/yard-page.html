<title>Nightplot Yard Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen. Top bar, left rail (palette + props), Konva-style yard canvas, right inspector. Phone: canvas + bottom sheet. Tokens follow Nightplot's globals.css. */
:root {
  --bg: #f6f4ef; --fg: #252931; --card: #ffffff; --rail: #efede7; --muted: #525963; --quiet: #7a7f87;
  --border: #cbd0d4; --input: #adb5bc; --secondary: #e8e9eb;
  --primary: #85552c; --primary-fg: #ffffff; --lit: #c08a4c; --pick: #1f8f80; --danger: #af3333; --ok: #2f7d4a;
  --grid: rgba(37,41,49,.07); --grid-strong: rgba(37,41,49,.16); --canvas: #fbfaf7;
  --serif: "Fraunces", Georgia, serif; --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c0d10; --fg: #ece7dc; --card: #0f1115; --rail: #0a0b0e; --muted: #9a9488; --quiet: #7d7870;
  --border: #1d2129; --input: #262c37; --secondary: #151820;
  --primary: #d4a574; --primary-fg: #0c0d10; --lit: #d4a574; --pick: #7ee0d0; --danger: #e07070; --ok: #7ee0a0;
  --grid: rgba(236,231,220,.05); --grid-strong: rgba(236,231,220,.12); --canvas: #090a0d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c0d10; --fg: #ece7dc; --card: #0f1115; --rail: #0a0b0e; --muted: #9a9488; --quiet: #7d7870;
  --border: #1d2129; --input: #262c37; --secondary: #151820;
  --primary: #d4a574; --primary-fg: #0c0d10; --lit: #d4a574; --pick: #7ee0d0; --danger: #e07070; --ok: #7ee0a0;
  --grid: rgba(236,231,220,.05); --grid-strong: rgba(236,231,220,.12); --canvas: #090a0d; color-scheme: dark; }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top { display: flex; align-items: center; gap: 18px; min-height: 52px; border-bottom: 1px solid var(--border); background: var(--rail);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-size: 17px; color: var(--primary); white-space: nowrap; }
.brand i { width: 30px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--lit) 0 20%, transparent 20% 27%, var(--lit) 27% 47%, transparent 47% 54%, var(--lit) 54% 74%, transparent 74% 81%, var(--lit) 81%); }
.nav { display: flex; gap: 2px; }
.nav a { padding: 6px 11px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 14px; }
.nav a.on { background: var(--secondary); color: var(--fg); font-weight: 500; }
.spacer { flex: 1; }
.lens { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.lens select { min-height: 34px; border: 1px solid var(--input); background: var(--card); border-radius: 6px; padding: 0 8px; }
.lens.on select { border-color: var(--pick); color: var(--pick); }
.saved { font-size: 13px; color: var(--muted); white-space: nowrap; min-width: 92px; text-align: right; }
.saved.busy { color: var(--primary); }
.iconbtn { min-height: 34px; min-width: 34px; border: 1px solid var(--border); background: transparent; border-radius: 6px; padding: 0 9px; font-size: 13px; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.trybtn { border-color: var(--primary); color: var(--primary); }

.main { display: grid; grid-template-columns: 210px minmax(0,1fr) 340px; min-height: 0; }
.rail { border-right: 1px solid var(--border); background: var(--rail); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 18px; }
.rail h2, .insp h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--quiet); font-weight: 500; margin: 0 0 8px; }
.palette { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.shape { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); font-size: 12px; }
.shape svg { width: 34px; height: 24px; stroke: var(--lit); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.shape.on { border-color: var(--pick); color: var(--pick); }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.plist button { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; min-height: 34px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; }
.plist button.on { background: var(--secondary); }
.plist .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lit); flex: none; }
.plist .n { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--quiet); }
.plist .off .dot { background: var(--input); }

.stagewrap { position: relative; min-width: 0; min-height: 0; background: var(--canvas); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.modechip { position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); font-size: 12px; }
.modechip b { font-weight: 600; }
.modechip.path { border-color: var(--pick); }
.hint { position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 200px); font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--canvas) 80%, transparent); padding: 4px 8px; border-radius: 6px; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; }
.zoom button { min-width: 36px; min-height: 36px; border: 1px solid var(--border); background: var(--card); border-radius: 6px; }
.tools { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--pick); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.tools button { min-height: 34px; padding: 0 10px; border: 1px solid transparent; background: transparent; border-radius: 6px; font-size: 13px; white-space: nowrap; }
.tools button[aria-pressed="true"] { background: var(--pick); color: var(--bg); }
.tools .done { background: var(--primary); color: var(--primary-fg); }
.tools .sep { width: 1px; background: var(--border); margin: 4px 2px; }
.coords { position: absolute; pointer-events: none; font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--pick); color: var(--bg); }

.insp { border-left: 1px solid var(--border); background: var(--bg); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.insp .title { display: flex; align-items: baseline; gap: 8px; }
.insp .title h1 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 0; min-width: 0; overflow-wrap: anywhere; }
.insp .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
label.f input, label.f select { min-height: 36px; width: 100%; border: 1px solid var(--input); border-radius: 6px; background: var(--card); padding: 0 8px; font-size: 15px; color: var(--fg); }
label.f input[type=checkbox] { width: 18px; min-height: 18px; height: 18px; flex: none; accent-color: var(--pick); }
label.f input.num { font-family: var(--mono); font-size: 14px; }
label.f input:focus, label.f select:focus { border-color: var(--primary); outline: none; }
.note { font-size: 12px; color: var(--quiet); line-height: 1.45; margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--input); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 10px; font-size: 13px; min-height: 32px; }
.seg button[aria-pressed="true"] { background: var(--secondary); font-weight: 600; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { min-height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); font-size: 13px; }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
.btn.link { border: 0; background: transparent; color: var(--primary); padding: 0 4px; }
details.fold { border-top: 1px solid var(--border); padding-top: 10px; }
details.fold > summary { list-style: none; display: flex; align-items: center; gap: 8px; cursor: pointer; min-height: 32px; font-weight: 500; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸"; color: var(--quiet); transition: transform .15s; }
details.fold[open] > summary::before { transform: rotate(90deg); }
details.fold > summary .meta { margin-left: auto; font-size: 12px; color: var(--quiet); font-weight: 400; }
.foldbody { display: flex; flex-direction: column; gap: 10px; padding: 8px 0 4px; }
.secrow { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
.secrow.on { border-color: var(--pick); }
.secrow .sw { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.secrow .nm { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 8px 0; }
.secrow .rng { font-family: var(--mono); font-size: 11px; color: var(--quiet); }
.colorf { display: flex; gap: 6px; align-items: center; }
.colorf input[type=color] { width: 40px; height: 36px; padding: 0; border: 1px solid var(--input); border-radius: 6px; background: transparent; }
.colorf input.hex { flex: 1; min-width: 0; min-height: 36px; border: 1px solid var(--input); border-radius: 6px; background: var(--card); padding: 0 8px; font-family: var(--mono); }
.confirm { border: 1px solid var(--danger); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.stat { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--border); }
.stat b { font-family: var(--mono); font-weight: 500; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps li { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.steps .m { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border); color: var(--quiet); }
.steps .m.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, var(--border)); }
.steps .m.next { color: var(--primary); border-color: var(--primary); }
.readback { font-size: 12px; padding: 8px; border-radius: 6px; background: var(--secondary); line-height: 1.45; }
.proto { font-size: 11px; color: var(--quiet); border: 1px dashed var(--border); border-radius: 6px; padding: 6px 8px; }

.tasks { position: absolute; right: 16px; top: 60px; width: min(360px, calc(100vw - 32px)); max-height: calc(100% - 80px); overflow-y: auto; background: var(--card); border: 1px solid var(--primary); border-radius: 12px; padding: 14px; z-index: 30; box-shadow: 0 14px 40px rgba(0,0,0,.3); }
.tasks h3 { margin: 0 0 4px; font-family: var(--serif); font-weight: 500; font-size: 18px; }
.tasks ol { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.tasks li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; font-size: 13px; }
.tasks li small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.4; }
.tasks .tick { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--input); display: grid; place-items: center; font-size: 11px; }
.tasks .tick.ok { background: var(--ok); border-color: var(--ok); color: var(--bg); }

.phonebar { display: none; }
.sheethandle { display: none; }

@media (max-width: 860px) {
  .nav, .lens .lbl, .saved, #redo { display: none; }
  .top { overflow: hidden; }
  .lens select { max-width: 132px; }
  .trybtn { padding: 0 7px; }
  .trybtn .wide { display: none; }
  .top { gap: 8px; }
  .main { grid-template-columns: 1fr; position: relative; }
  .rail { position: absolute; inset: 0 auto 0 0; width: min(260px, 80vw); z-index: 20; transform: translateX(-102%); transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.3); }
  .rail.open { transform: none; }
  .insp { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; border-left: 0; border-top: 1px solid var(--border); border-radius: 14px 14px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.25);
    max-height: 32%; transition: max-height .2s; padding-top: 6px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
  .insp.half { max-height: 58%; }
  .insp.full { max-height: 88%; }
  .sheethandle { display: block; align-self: center; width: 44px; height: 22px; border: 0; background: transparent; flex: none; }
  .sheethandle::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--input); margin: 0 auto; }
  .phonebar { display: flex; position: absolute; left: 12px; top: 56px; z-index: 12; gap: 6px; }
  .phonebar button { min-height: 40px; min-width: 40px; border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 0 10px; }
  .modechip { top: 104px; }
  .hint { display: none; }
  .zoom { bottom: auto; top: 56px; }
  .tools { top: 104px; left: 12px; right: 12px; transform: none; overflow-x: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* v2: the yard view sees and places; a scoped prop canvas builds and edits one prop. */
.newbtn { width: 100%; min-height: 40px; border: 1px solid var(--primary); background: var(--primary); color: var(--primary-fg); border-radius: 8px; font-weight: 600; }
.crumb { display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 0; }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--fg); }
.crumb b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dirty { font-size: 12px; color: var(--primary); white-space: nowrap; }
.app.editing .top { background: color-mix(in srgb, var(--pick) 10%, var(--rail)); }
.app.editing .stagewrap { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--pick) 55%, transparent); }
.main.editor { grid-template-columns: minmax(0,1fr) 360px; }
.main.editor .rail { display: none; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tiles .shape.on { border-color: var(--pick); color: var(--pick); background: color-mix(in srgb, var(--pick) 8%, var(--card)); }
.empty { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.empty div { text-align: center; color: var(--muted); font-size: 14px; max-width: 280px; line-height: 1.5; }
.empty strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 22px; color: var(--fg); margin-bottom: 6px; }
.sectionrows { display: flex; flex-direction: column; gap: 4px; }
.discard { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; padding: 8px 10px; border: 1px solid var(--danger); border-radius: 8px; background: var(--card); }
.runbox { border: 1px solid var(--pick); border-radius: 10px; padding: 10px; background: color-mix(in srgb, var(--pick) 6%, var(--card)); display: flex; flex-direction: column; gap: 4px; }
.runbox h2 { color: var(--pick) !important; }
.stepper { display: grid; grid-template-columns: 44px 1fr 44px; gap: 6px; }
.stepper button { min-height: 44px; border: 1px solid var(--input); border-radius: 6px; background: var(--card); font-size: 20px; }
.stepper input { min-height: 44px !important; text-align: center; font-size: 17px !important; }
@media (max-width: 860px) {
  .main.editor { grid-template-columns: 1fr; }
  .app.editing .modechip, .app.editing .hint, .app.editing .zoom { display: none; }
  .app.editing .tools { top: 8px; left: 8px; right: 8px; justify-content: space-between; }
  .app.editing .tools button { padding: 0 8px; font-size: 13px; }
  .insp { max-height: 34%; }
  .crumb a, .crumb span, .app.editing #dirty, .app.editing #tryBtn, .app.editing #redo { display: none !important; }
  .crumb b { max-width: 90px; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <span class="brand"><i aria-hidden="true"></i>Nightplot</span>
    <nav class="nav" id="nav" aria-label="Nightplot">
      <a href="#" class="on" aria-current="page">Yard</a><a href="#" data-soon>Looks</a><a href="#" data-soon>Lights</a><a href="#" data-soon>Check</a><a href="#" data-soon>More</a>
    </nav>
    <div class="crumb" id="crumb" hidden></div>
    <span class="spacer"></span>
    <span class="dirty" id="dirty" hidden>Not saved yet</span>
    <button class="iconbtn" id="undo" title="Undo (Ctrl/⌘+Z)" aria-label="Undo">↶</button>
    <button class="iconbtn" id="redo" title="Redo (Shift+Ctrl/⌘+Z)" aria-label="Redo">↷</button>
    <span class="saved" id="saved" role="status">Saved</span>
    <button class="btn" id="cancelBtn" hidden>Cancel</button>
    <button class="btn primary" id="saveBtn" hidden>Save</button>
    <button class="btn primary" id="doneBtn" hidden>Done</button>
    <button class="iconbtn trybtn" id="tryBtn" aria-expanded="false"><span class="wide">Test </span>tasks</button>
  </header>
  <div class="main" id="main">
    <aside class="rail" id="rail">
      <button class="newbtn" data-act="new">+ New prop</button>
      <section>
        <h2>Props</h2>
        <ul class="plist" id="plist"></ul>
      </section>
      <section>
        <h2>Looks</h2>
        <ul class="plist" id="llist"></ul>
        <button class="btn" data-act="newlook" style="margin-top:6px;width:100%">+ New Look</button>
      </section>
      <p class="proto">Prototype. Everything stays in this page. Nothing is saved to Nightplot or sent to a controller.</p>
    </aside>
    <div class="stagewrap" id="stagewrap">
      <canvas id="cv" aria-label="Drawing" tabindex="0"></canvas>
      <div class="empty" id="empty" hidden><div><strong>A clean canvas</strong>Pick a starting shape in the panel, or choose Draw it and click where the wire comes in.</div></div>
      <div class="phonebar" id="phonebar"><button id="railBtn" aria-label="Props">☰ Props</button><button data-act="new">+ New</button></div>
      <div class="modechip" id="modechip"></div>
      <div class="tools" id="tools" hidden></div>
      <div class="coords" id="coords" hidden></div>
      <p class="hint" id="hint"></p>
      <div class="zoom"><button id="zout" aria-label="Zoom out">−</button><button id="zin" aria-label="Zoom in">+</button><button id="zfit">Fit</button></div>
      <div class="tasks" id="tasks" hidden></div>
    </div>
    <aside class="insp" id="insp" aria-label="Details"></aside>
  </div>
</div>

<script>
(() => {
  "use strict";
  // ---------- model ----------
  const FT = 0.3048;
  const SHAPES = [
    { kind: "line", title: "Line", svg: '<path d="M3 16 L31 8"/>' },
    { kind: "window", title: "Window", svg: '<rect x="6" y="3" width="22" height="18" rx="1"/>' },
    { kind: "triangle", title: "Triangle", svg: '<path d="M5 21 L17 3 L29 21 Z"/>' },
    { kind: "tree", title: "Mini tree", svg: '<path d="M7 21 L17 3 L27 21"/><path d="M17 21v-2"/>' },
    { kind: "arch", title: "Arch", svg: '<path d="M4 21 C4 2, 30 2, 30 21"/>' },
    { kind: "draw", title: "Draw it", svg: '<path d="M4 19 L12 9 L20 15 L30 5"/><circle cx="4" cy="19" r="1.5"/>' },
  ];
  const TITLES = Object.fromEntries(SHAPES.map((s) => [s.kind, s.title]));
  const DEFAULTS = { line: { length: 4 }, window: { width: 1.5, height: 1.2 }, triangle: { width: 2, height: 2 }, tree: { width: 1, height: 1.5 }, arch: { width: 3, height: 2 }, draw: {} };
  const PALETTE = ["#e05a4f", "#4fb36a", "#4f8de0", "#e0b84f", "#b36ae0", "#4fd0e0"];

  function template(kind, p) {
    const C = (pts) => pts.map(([x, y]) => ({ x, y }));
    switch (kind) {
      case "line": return { corners: C([[0, 0], [p.length, 0]]), runs: [[0, 1, "Run 1"]] };
      case "window": return { corners: C([[0, 0], [p.width, 0], [p.width, p.height], [0, p.height]]), runs: [[0, 1, "Bottom"], [1, 2, "Right side"], [2, 3, "Top"], [3, 0, "Left side"]] };
      case "triangle": return { corners: C([[0, 0], [p.width, 0], [p.width / 2, p.height]]), runs: [[0, 1, "Base"], [1, 2, "Right side"], [2, 0, "Left side"]] };
      case "tree": return { corners: C([[0, 0], [p.width / 2, p.height], [p.width, 0]]), runs: [[0, 1, "Left side"], [1, 2, "Right side"]] };
      case "arch": {
        const n = 8, pts = [];
        for (let i = 0; i <= n; i++) { const t = Math.PI - (Math.PI * i) / n; pts.push([p.width / 2 + Math.cos(t) * p.width / 2, Math.sin(t) * p.height]); }
        return { corners: C(pts), runs: pts.slice(1).map((_, i) => [i, i + 1, `Arc ${i + 1}`]) };
      }
      default: return { corners: [], runs: [] };
    }
  }
