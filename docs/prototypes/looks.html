<title>Nightplot Looks Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Looks prototype. Same tokens and shell as the one-page yard prototype (PR #142).
   Yard (home) · Looks page (library, playlists, schedule, by prop) · Look view (scoped, the yard in one Look). */
:root {
  --bg: #f6f4ef; --fg: #252931; --card: #ffffff; --rail: #efede7; --muted: #525963; --quiet: #6f747c;
  --border: #cbd0d4; --input: #adb5bc; --secondary: #e8e9eb;
  --primary: #85552c; --primary-fg: #ffffff; --lit: #c08a4c; --pick: #1f8f80; --danger: #af3333; --ok: #2f7d4a; --warn: #9a6a00;
  --night: #0b0d12; --nightfg: #c9c4b8;
  --serif: "Fraunces", Georgia, serif; --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c0d10; --fg: #ece7dc; --card: #0f1115; --rail: #0a0b0e; --muted: #a39d91; --quiet: #8a857c;
  --border: #1d2129; --input: #2c3340; --secondary: #151820;
  --primary: #d4a574; --primary-fg: #0c0d10; --lit: #d4a574; --pick: #7ee0d0; --danger: #e07070; --ok: #7ee0a0; --warn: #e6c068;
  --night: #07080b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c0d10; --fg: #ece7dc; --card: #0f1115; --rail: #0a0b0e; --muted: #a39d91; --quiet: #8a857c;
  --border: #1d2129; --input: #2c3340; --secondary: #151820;
  --primary: #d4a574; --primary-fg: #0c0d10; --lit: #d4a574; --pick: #7ee0d0; --danger: #e07070; --ok: #7ee0a0; --warn: #e6c068;
  --night: #07080b; color-scheme: dark; }

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
#body > * { min-height: 0; }
.top { display: flex; align-items: center; gap: 14px; min-height: 52px; border-bottom: 1px solid var(--border); background: var(--rail); padding: 0 16px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-size: 17px; color: var(--primary); white-space: nowrap; }
.brand i { width: 30px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--lit) 0 20%, transparent 20% 27%, var(--lit) 27% 47%, transparent 47% 54%, var(--lit) 54% 74%, transparent 74% 81%, var(--lit) 81%); }
.nav { display: flex; gap: 2px; }
.nav a { padding: 6px 11px; border-radius: 6px; color: var(--muted); text-decoration: none; }
.nav a.on { background: var(--secondary); color: var(--fg); font-weight: 500; }
.spacer { flex: 1; }
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 14px; }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb select { font-weight: 600; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 4px; max-width: 220px; }
.crumb select:hover { border-color: var(--border); }
.sendpill { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; border: 1px solid var(--primary); color: var(--primary); background: var(--card); border-radius: 999px; padding: 0 12px; font-size: 13px; white-space: nowrap; }
.sendpill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.sendpill.ok { border-color: var(--border); color: var(--muted); }
.sendpill.ok::before { background: var(--ok); }
.iconbtn { min-height: 34px; border: 1px solid var(--border); background: transparent; border-radius: 6px; padding: 0 10px; font-size: 13px; white-space: nowrap; }
.toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); font-size: 13px; white-space: nowrap; }
.toggle .sw { width: 30px; height: 18px; border-radius: 9px; background: var(--input); position: relative; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
.toggle[aria-pressed="true"] { border-color: var(--pick); color: var(--pick); }
.toggle[aria-pressed="true"] .sw { background: var(--pick); }
.toggle[aria-pressed="true"] .sw::after { left: 14px; }

.main { display: grid; grid-template-columns: 220px minmax(0,1fr) 360px; min-height: 0; }
.rail { border-right: 1px solid var(--border); background: var(--rail); overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 18px; }
.cap { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--quiet); font-weight: 500; margin: 0 0 8px; }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.plist button { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; min-height: 36px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; }
.plist button.on { background: var(--secondary); font-weight: 500; }
.plist .n { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--quiet); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1px solid color-mix(in srgb, var(--fg) 20%, transparent); }
.stagewrap { position: relative; min-width: 0; min-height: 0; background: var(--night); }
canvas.stage { display: block; width: 100%; height: 100%; touch-action: none; }
.chip { position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; background: rgba(15,17,21,.85); color: #ece7dc; border: 1px solid #2a2f39; font-size: 12px; max-width: calc(100% - 24px); }
.chip.preview { border-color: #7ee0d0; }
.stagehint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: #a39d91; background: rgba(7,8,11,.7); padding: 4px 8px; border-radius: 6px; max-width: calc(100% - 24px); }

.insp { border-left: 1px solid var(--border); background: var(--bg); overflow-y: auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.insp > *, .box > *, .dialog > *, .item > * { flex-shrink: 0; }
.title h1 { font-family: var(--serif); font-weight: 500; font-size: 22px; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.note { font-size: 12px; color: var(--quiet); line-height: 1.45; }
.warnnote { font-size: 12px; color: var(--warn); line-height: 1.45; }
.proto { font-size: 11px; color: var(--quiet); border: 1px dashed var(--border); border-radius: 6px; padding: 6px 8px; line-height: 1.4; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
label.f input:not([type=checkbox]):not([type=range]):not([type=color]), label.f select, .in { min-height: 38px; width: 100%; border: 1px solid var(--input); border-radius: 6px; background: var(--card); padding: 0 8px; font-size: 15px; color: var(--fg); }
.in.num { font-family: var(--mono); font-size: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn { min-height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); font-size: 13px; }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
.btn.link { border: 0; background: transparent; color: var(--primary); padding: 0 4px; min-height: 30px; }
.btn.small { min-height: 30px; padding: 0 8px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--input); border-radius: 8px; overflow: hidden; }
.seg3 button { border: 0; border-right: 1px solid var(--input); background: var(--card); min-height: 40px; font-size: 13px; }
.seg3 button:last-child { border-right: 0; }
.seg3 button[aria-pressed="true"] { background: var(--secondary); font-weight: 600; box-shadow: inset 0 -3px 0 var(--pick); }
.seg3 button small { display: block; font-size: 11px; color: var(--quiet); font-weight: 400; }
.box { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--card); display: flex; flex-direction: column; gap: 12px; }
.box.mixed { border-style: dashed; }
.effrow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; border: 1px solid var(--input); border-radius: 8px; background: var(--card); padding: 6px 10px; text-align: left; }
.effrow b { font-weight: 600; white-space: nowrap; }
.effrow .meta { font-size: 11px; color: var(--quiet); }
.effrow canvas, canvas.strip { width: 100%; height: 12px; border-radius: 6px; background: #000; display: block; }
.effrow .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.effrow.on { border-color: var(--pick); box-shadow: inset 0 0 0 1px var(--pick); }
.colours { display: flex; flex-direction: column; gap: 8px; }
.colourrow { display: grid; grid-template-columns: 74px 40px 1fr; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.colourrow input[type=color] { width: 40px; height: 38px; padding: 0; border: 1px solid var(--input); border-radius: 6px; background: transparent; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatches button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--input); }
.slider { display: grid; grid-template-columns: 96px 1fr 40px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.slider input { width: 100%; accent-color: var(--pick); min-height: 32px; }
.slider output { font-family: var(--mono); font-size: 12px; text-align: right; }
.pals { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pals button { border: 1px solid var(--input); background: var(--card); border-radius: 8px; padding: 6px; text-align: left; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.pals button.on { border-color: var(--pick); box-shadow: inset 0 0 0 1px var(--pick); }
.pals i { display: block; height: 10px; border-radius: 5px; }
details.fold { border-top: 1px solid var(--border); padding-top: 8px; }
details.fold > summary { list-style: none; display: flex; align-items: center; gap: 8px; cursor: pointer; min-height: 34px; font-weight: 500; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸"; color: var(--quiet); transition: transform .15s; }
details.fold[open] > summary::before { transform: rotate(90deg); }
details.fold > summary .meta { margin-left: auto; font-size: 12px; color: var(--quiet); font-weight: 400; }
.foldbody { display: flex; flex-direction: column; gap: 10px; padding: 8px 0 4px; }
.proprow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; min-height: 40px; }
.proprow > button { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; text-align: left; padding: 0; min-height: 40px; min-width: 0; }
.mini3 { display: inline-flex; border: 1px solid var(--input); border-radius: 6px; overflow: hidden; }
.mini3 button { border: 0; border-right: 1px solid var(--input); background: var(--card); padding: 0 8px; min-height: 30px; font-size: 12px; }
.mini3 button:last-child { border-right: 0; }
.mini3 button[aria-pressed="true"] { background: var(--secondary); font-weight: 600; color: var(--pick); }
.secchips { display: flex; gap: 6px; flex-wrap: wrap; }
.secchips button { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); padding: 0 12px; font-size: 13px; }
.secchips button[aria-pressed="true"] { border-color: var(--pick); color: var(--pick); font-weight: 600; }
.banner { border: 1px solid var(--pick); background: color-mix(in srgb, var(--pick) 8%, var(--card)); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.45; display: flex; flex-direction: column; gap: 8px; }
.banner.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--card)); }

/* Looks page */
.page { overflow-y: auto; padding: 20px 24px 140px; }
.pagein { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.pagehead { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.pagehead h1 { font-family: var(--serif); font-weight: 500; font-size: 28px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 12px; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--primary); font-weight: 500; }
.nowbar { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 14px 16px; }
.nowbar .big { font-family: var(--serif); font-size: 20px; }
.lightsrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.lightpill { font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; color: var(--muted); }
.lightpill.bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
.lightpill.behind { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--border)); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--border); border-radius: 12px; background: var(--card); overflow: hidden; display: flex; flex-direction: column; }
.card canvas { width: 100%; aspect-ratio: 16/8; display: block; background: var(--night); cursor: pointer; }
.card .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.card .row { display: flex; align-items: center; gap: 8px; }
.card h3 { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--quiet); white-space: nowrap; }
.tag.new { color: var(--primary); border-color: var(--primary); }
.tag.live { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, var(--border)); }
.card.add { align-items: center; justify-content: center; min-height: 180px; border-style: dashed; color: var(--muted); font-size: 14px; gap: 8px; cursor: pointer; background: transparent; }
.list { display: flex; flex-direction: column; gap: 10px; }
.item { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.item.open { border-color: var(--pick); }
.itemhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.itemhead h3 { font-size: 15px; font-weight: 600; }
.itemhead .sub { margin: 0; }
.plrow { display: grid; grid-template-columns: 22px minmax(0,1fr) 92px auto; gap: 8px; align-items: center; }
.plrow .ix { font-family: var(--mono); color: var(--quiet); font-size: 12px; }
.yearbar { position: relative; height: 54px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); overflow: hidden; }
.yearbar .m { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--border); font-size: 10px; color: var(--quiet); padding: 2px 3px; }
.yearbar .r { position: absolute; height: 14px; border-radius: 3px; font-size: 10px; color: #fff; padding: 0 4px; overflow: hidden; white-space: nowrap; line-height: 14px; }
.yearbar .today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); }
.days { display: flex; gap: 4px; flex-wrap: wrap; }
.days button { min-width: 38px; min-height: 34px; border: 1px solid var(--input); border-radius: 6px; background: var(--card); font-size: 12px; }
.days button[aria-pressed="true"] { background: var(--pick); color: var(--bg); border-color: var(--pick); }
.budget { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.budget i { width: 18px; height: 10px; border-radius: 2px; background: var(--secondary); border: 1px solid var(--border); }
.budget i.u { background: var(--pick); border-color: var(--pick); }
.budget i.x { background: var(--danger); border-color: var(--danger); }
table.matrix { border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 100%; }
.matrixwrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
table.matrix th, table.matrix td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
table.matrix th { font-weight: 500; color: var(--muted); font-size: 12px; position: sticky; top: 0; background: var(--card); }
table.matrix td:first-child, table.matrix th:first-child { position: sticky; left: 0; background: var(--card); font-weight: 500; z-index: 1; }
.cell { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 0; min-height: 30px; font-size: 12px; color: var(--muted); }
.cell canvas { width: 54px; height: 10px; border-radius: 5px; background: #000; }
.cell.off { color: var(--quiet); }

/* Dialog */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dialog { width: min(520px, 100%); max-height: calc(100% - 32px); overflow-y: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
.dialog h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; }
.dialog h2.cap { font-family: var(--sans); font-size: 11px; }
.resrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
.resrow .why { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.st { font-size: 12px; font-weight: 600; }
.st.ok { color: var(--ok); } .st.bad { color: var(--danger); } .st.wait { color: var(--quiet); }
.check { display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--pick); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: 13px; z-index: 60; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.toast button { border: 0; background: transparent; color: var(--bg); font-weight: 600; text-decoration: underline; min-height: 30px; }

/* Tasks */
.tasks { position: fixed; left: 16px; bottom: 16px; width: min(380px, calc(100vw - 32px)); max-height: 60%; overflow-y: auto; background: var(--card); border: 1px solid var(--primary); border-radius: 12px; padding: 14px; z-index: 40; box-shadow: 0 14px 40px rgba(0,0,0,.3); }
.tasks.mini { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.tasks h3 { font-family: var(--serif); font-weight: 500; font-size: 18px; }
.tasks ol { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.tasks li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; font-size: 13px; line-height: 1.4; }
.tasks .tick { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--input); display: grid; place-items: center; font-size: 11px; margin-top: 1px; }
.tasks .tick.ok { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.tasks .sim { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }

.phonenav { display: none; }
.backbtn { display: none; }

@media (max-width: 860px) {
  .nav, .hidephone { display: none !important; }
  .top { gap: 8px; padding: 0 12px; }
  .main { grid-template-columns: 1fr; grid-template-rows: minmax(200px, 40%) 1fr; }
  .main.yard { grid-template-rows: minmax(200px, 46%) 1fr; }
  .rail { display: none; }
  .insp { border-left: 0; border-top: 1px solid var(--border); padding: 14px 16px 150px; }
  .page { padding: 14px 16px 30px; }
  .pagehead h1 { font-size: 24px; }
  .phonenav { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--border); background: var(--rail); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .phonenav a { text-align: center; padding: 10px 0 12px; font-size: 12px; color: var(--muted); text-decoration: none; }
  .phonenav a.on { color: var(--primary); font-weight: 600; }
  .app.scoped .phonenav { display: none; }
  .nowbar { grid-template-columns: 1fr; }
  .cards { grid-template-columns: 1fr 1fr; gap: 8px; }
  .card .body { padding: 8px 10px; }
  .card .row .btn { min-height: 34px; padding: 0 8px; }
  .plrow { grid-template-columns: 18px minmax(0,1fr) 72px auto; }
  .crumb select { max-width: 140px; }
  .backbtn { display: inline-flex; }
  .toggle .lbl { display: none; }
  .sendpill { padding: 0 10px; font-size: 12px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  .sendpill .long { display: none; }
  .brand { font-size: 0; gap: 0; }
